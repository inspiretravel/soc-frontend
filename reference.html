<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework mapping — CyberTriageAI</title>
<meta name="description" content="The same honeypot evidence expressed against MITRE ATT&CK, the ACSC Essential Eight, NIST CSF 2.0 and ISO/IEC 27001:2022.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  @keyframes fillIn { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  .fw { white-space: nowrap; cursor: pointer; font-family: "IBM Plex Sans", sans-serif; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.62); background: transparent; border: 1px solid rgba(255,255,255,.14); border-radius: 50px; padding: 10px 20px; transition: all .3s cubic-bezier(.22,1,.36,1); }
  .fw:hover { color: #fff; border-color: rgba(242,84,125,.5); }
  .fw[aria-pressed="true"] { background: #F2547D; border-color: #F2547D; color: #150F2C; font-weight: 600; }
  .ctrl { display: grid; grid-template-columns: 96px minmax(0,1fr) 104px 92px; gap: 14px; align-items: center; padding: 14px 14px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; transition: background .3s, border-color .3s; animation: rise .45s cubic-bezier(.22,1,.36,1) both; width: 100%; text-align: left; background: transparent; color: #fff; font-family: inherit; }
  .ctrl:hover { background: rgba(242,84,125,.08); border-color: rgba(242,84,125,.3); }
  .ctrl[aria-pressed="true"] { background: rgba(242,84,125,.13); border-color: rgba(242,84,125,.5); }
  .ctrl .chip { font-size: 10px; padding: 3px 7px; }
  .doc { background: #1C1640; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 26px 28px; }
  .doc h4 { font-family: Archivo, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: #F2547D; margin: 0 0 8px; }
  .doc p { margin: 0; font-size: 14px; line-height: 24px; color: rgba(255,255,255,.78); }
  .doc section { animation: fillIn .5s cubic-bezier(.22,1,.36,1) both; }
  .doc hr { border: 0; height: 1px; background: rgba(255,255,255,.08); margin: 18px 0; }
  .heat { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
  .heat div { height: 46px; border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 9px; color: rgba(255,255,255,.7); text-align: center; line-height: 1.1; overflow: hidden; }
  #shell { display: grid; grid-template-columns: minmax(0,1fr) 480px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { #shell { grid-template-columns: minmax(0,1fr); } }
  @media (max-width: 700px) { .ctrl { grid-template-columns: 80px minmax(0,1fr); } .ctrl > :nth-child(3), .ctrl > :nth-child(4) { display: none; } .heat { grid-template-columns: repeat(4, minmax(0,1fr)); } }
</style>
</head>
<body>

<header id="site-header"></header>

<div style="padding:20px;display:flex;flex-direction:column;gap:16px;">

  <section style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;">
    <div>
      <h1 style="font-family:Archivo,sans-serif;font-size:26px;font-weight:600;letter-spacing:-.5px;margin:0;">Pick a framework. The assessment writes itself.</h1>
      <p id="intro" style="margin:6px 0 0;font-size:14px;color:rgba(255,255,255,.55);max-width:70ch;"></p>
    </div>
    <div id="rangeSel"></div>
  </section>

  <div id="fws" style="display:flex;gap:10px;flex-wrap:wrap;" role="group" aria-label="Choose a framework"></div>

  <div id="shell">
    <div style="display:flex;flex-direction:column;gap:16px;">
      <section class="panel" style="padding:20px 22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">
          <div class="eyebrow" id="covTitle">Coverage</div>
          <div id="covStats" style="display:flex;gap:22px;flex-wrap:wrap;"></div>
        </div>
        <div id="heatWrap" style="margin-top:18px;"></div>
      </section>

      <section class="panel" style="padding:12px 10px 18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 12px;flex-wrap:wrap;">
          <div class="eyebrow" id="ctrlTitle">Controls</div>
          <span style="font-size:12px;color:rgba(255,255,255,.4);">click a control to see the sentence it produces</span>
        </div>
        <div id="ctrls" style="display:flex;flex-direction:column;gap:2px;"></div>
      </section>
    </div>

    <section class="panel" style="padding:20px;position:relative;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div class="eyebrow">Threat assessment · auto-filled</div>
        <span id="fillState" class="mono" style="font-size:11px;color:#5FE3B0;">ready</span>
      </div>
      <div class="bar" style="margin-top:12px;"><i id="fillBar" style="background:linear-gradient(90deg,#F2547D,#5FE3B0);"></i></div>
      <div id="doc" class="doc" style="margin-top:16px;" aria-live="polite"></div>
    </section>
  </div>
</div>

<footer id="site-footer"></footer>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/figures.js"></script>
<script src="assets/site.js"></script>
<script>
window.Site.ready(function () {
  var S = window.Site, el = S.el, fmt = S.fmt;
  S.embed("refHeight", document.body);
  S.renderHeader("reference.html", S.sourceBadge());
  S.renderFooter();

  // Status is DERIVED from evidence, two states only (docs/FIELD_MAPPING.md §G): n > 0 → EVIDENCED, else NO EVIDENCE.
  var ST_COLOR = { EVIDENCED: "#C4173F", CLEAR: "#5FE3B0" };
  var LABEL = { EVIDENCED: "EVIDENCED", CLEAR: "NO EVIDENCE" };
  var RANGE_WORDS = { day: "the last 24 hours", week: "the last 7 days", month: "the last 30 days", all: "all recorded time" };
  var RANGE_WINDOW = { day: "24h window", week: "7-day window", month: "30-day window", all: "all-time window" };

  var FRAMEWORKS = [], fw = 0, csel = 0;

  // Rebuilds FRAMEWORKS from the CURRENT D/ST (called on load and on every range switch —
  // D/ST are replaced wholesale by a range fetch, so this can't be computed just once).
  function buildFrameworks() {
    var D = S.data(), ST = S.STATS, range = S.currentRange();
    S.replace(S.$("intro"), "Your honeypot evidence is already mapped against " + fmt(D.mitreTechniqueCount) + " MITRE ATT&CK Enterprise techniques. Choose the scheme you report against and we fill the threat assessment from the same findings — no re-typing, no invented controls.");

    // Resolve each control's evidence count from the queue (or a derived token) so it can never drift from the dashboard.
    FRAMEWORKS = D.frameworks.map(function (f) {
      var controls = f.controls.map(function (c) {
        var n = c.from ? S.tokenValue(c.from) : 0;
        var out = {}; Object.keys(c).forEach(function (k) { out[k] = c[k]; });
        out.n = typeof n === "number" ? n : 0; out.line = S.fill(c.line);
        out.status = out.n > 0 ? "EVIDENCED" : "CLEAR";
        return out;
      });
      // Rating is DERIVED: worst severity among evidenced techniques in the selected range.
      var evidTids = controls.filter(function (c) { return c.status === "EVIDENCED"; }).map(function (c) { return c.from; });
      var worst = 0; ST.queue.forEach(function (q) { if (evidTids.indexOf(q.id) >= 0 || evidTids.indexOf("CRED") >= 0 && (q.id === "T1110" || q.id === "T1078")) worst = Math.max(worst, S.SEV_ORDER.length - S.SEV_ORDER.indexOf(q.sev)); });
      var critN = ST.queue.filter(function (q) { return q.sev === "CRITICAL"; }).length, highN = ST.queue.filter(function (q) { return q.sev === "HIGH"; }).length;
      var rating = critN ? "HIGH" : highN ? "MEDIUM" : ST.queue.length ? "LOW" : "NONE";
      var ratingWhy = critN ? critN + " technique" + (critN === 1 ? "" : "s") + " observed at CRITICAL severity in " + RANGE_WORDS[range] + "." :
                      highN ? highN + " technique" + (highN === 1 ? "" : "s") + " observed at HIGH severity in " + RANGE_WORDS[range] + "; nothing critical." :
                      ST.queue.length ? "Only low/medium-severity activity in " + RANGE_WORDS[range] + "." : "No honeypot events in " + RANGE_WORDS[range] + ".";
      var max = Math.max.apply(null, controls.map(function (c) { return c.n; }).concat([1]));
      controls.forEach(function (c) { c.w = Math.round(c.n / max * 100); });
      var stats;
      if (f.key === "attack") stats = [["Tactics touched", ST.tacticsTouched + " of " + D.tactics.length]];
      else if (f.key === "e8") stats = [["Strategies mapped", controls.length + " of 8"]];
      else if (f.key === "nist") stats = [["Functions covered", "6 of 6"]];
      else stats = [["Annex A controls", controls.length + " cited"]];
      return { key: f.key, name: f.name, sub: S.fill(f.sub), scope: S.fill(f.scope), rating: rating, ratingWhy: ratingWhy, controls: controls, stats: stats };
    });
    if (fw >= FRAMEWORKS.length) fw = 0;
  }

  function renderFws() {
    S.replace(S.$("fws"), FRAMEWORKS.map(function (f, i) {
      return el("button", { className: "fw", type: "button", "aria-pressed": i === fw ? "true" : "false", onclick: function () { fw = i; csel = 0; render(); } }, f.name);
    }));
  }

  function renderHeat(f) {
    var wrap = S.$("heatWrap");
    if (f.key !== "attack") {
      S.replace(wrap, el("div", { style: "display:flex;flex-direction:column;gap:10px;" }, f.controls.map(function (c) {
        return el("div", { style: "display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:14px;align-items:center;" },
          el("span", { style: "font-size:13px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" }, c.name),
          el("div", { className: "bar" }, el("i", { "data-w": Math.max(3, c.w), style: "background:" + ST_COLOR[c.status] + ";" })));
      })));
      return;
    }
    // Tactic pressure computed from the queue: share of events (selected range) per ATT&CK tactic (all 14 Enterprise tactics).
    var D = S.data(), ST = S.STATS;
    var maxT = Math.max.apply(null, D.tactics.map(function (t) { return ST.byTactic[t] || 0; }).concat([1]));
    var heaviest = D.tactics.slice().sort(function (a, b) { return (ST.byTactic[b] || 0) - (ST.byTactic[a] || 0); }).slice(0, 2);
    S.replace(wrap,
      el("div", { className: "heat", role: "img", "aria-label": "Attack pressure by ATT&CK tactic" }, D.tactics.map(function (t) {
        var v = (ST.byTactic[t] || 0) / maxT;
        return el("div", { title: t + " · " + fmt(ST.byTactic[t] || 0) + " events", style: "background:linear-gradient(180deg,rgba(196,23,63," + (v * .85 + .05).toFixed(2) + "),rgba(242,84,125," + (v * .45 + .08).toFixed(2) + "));" }, t);
      })),
      el("div", { style: "display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:rgba(255,255,255,.35);gap:12px;flex-wrap:wrap;" },
        el("span", null, "quiet"), el("span", null, "heaviest pressure: " + heaviest.map(function (t) { return t.toLowerCase(); }).join(" · "))));
  }

  function renderCtrls(f) {
    S.replace(S.$("ctrls"), f.controls.map(function (c, i) {
      var idNode = f.key === "attack" ? S.mitreLink(c.id, "font-size:12px;") : el("span", { className: "mono", style: "font-size:12px;color:#F2547D;" }, c.id);
      return el("button", { className: "ctrl", type: "button", "aria-pressed": i === csel ? "true" : "false", style: "animation-delay:" + (i * 45) + "ms;", onclick: function () { csel = i; render(true); } },
        idNode,
        el("div", { style: "min-width:0;" },
          el("div", { style: "font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" }, c.name),
          el("div", { style: "margin-top:3px;font-size:12px;color:rgba(255,255,255,.42);" }, c.tactic)),
        el("span", { className: "chip", style: "border:1px solid " + ST_COLOR[c.status] + "55;color:" + ST_COLOR[c.status] + ";text-align:center;" }, LABEL[c.status]),
        el("div", { style: "text-align:right;" },
          el("div", { className: "mono", style: "font-size:13px;color:rgba(255,255,255,.8);" }, c.n ? fmt(c.n) : "—"),
          el("div", { className: "bar", style: "margin-top:6px;" }, el("i", { "data-w": Math.max(2, c.w), style: "background:" + ST_COLOR[c.status] + ";" }))));
    }));
  }

  function renderDoc(f, quick) {
    var gaps = f.controls.filter(function (c) { return c.status === "CLEAR"; });
    var sel = f.controls[csel];
    var sevColor = f.rating === "HIGH" ? "#C4173F" : f.rating === "MEDIUM" ? "#FFA85C" : "#6BC7F2";
    var winLabel = RANGE_WINDOW[S.currentRange()];
    S.replace(S.$("doc"),
      el("section", { style: "animation-delay:0ms;" }, el("h4", null, "Scope"), el("p", null, f.scope)),
      el("hr"),
      el("section", { style: "animation-delay:120ms;" }, el("h4", null, "Finding · " + (f.key === "e8" ? sel.name : sel.id)), el("p", null, sel.line),
        el("p", { style: "margin-top:10px;font-size:12px;color:rgba(255,255,255,.42);" }, "Source: " + (sel.n ? fmt(sel.n) + " events, " + winLabel : "no supporting events") + " · " + f.name)),
      el("hr"),
      el("section", { style: "animation-delay:240ms;" }, el("h4", null, "Overall rating"),
        el("div", { style: "display:flex;align-items:center;gap:12px;flex-wrap:wrap;" },
          el("span", { className: "chip", style: "border:1px solid " + sevColor + "66;color:" + sevColor + ";font-size:12px;padding:5px 10px;" }, f.rating),
          el("span", { style: "font-size:13px;color:rgba(255,255,255,.6);" },
            f.controls.filter(function (c) { return c.status === "EVIDENCED"; }).length + " evidenced · " + gaps.length + " no evidence in this " + winLabel)),
        el("p", { style: "margin-top:10px;" }, f.ratingWhy)),
      el("hr"),
      el("section", { style: "animation-delay:360ms;" }, el("h4", null, "Cannot be answered from this evidence"),
        el("p", null, gaps.length ? gaps.map(function (g) { return (f.key === "e8" ? "" : g.id + " ") + g.name; }).join(" · ") : "None — every cited control has supporting events.")),
      el("hr"),
      el("p", { className: "disclaimer" }, S.DISCLAIMER));

    var bar = S.$("fillBar"), state = S.$("fillState");
    bar.style.width = "0%"; state.textContent = "filling…"; state.style.color = "#F2547D";
    requestAnimationFrame(function () { bar.style.width = "100%"; });
    clearTimeout(window._fillT);
    window._fillT = setTimeout(function () { state.textContent = "ready"; state.style.color = "#5FE3B0"; }, quick ? 500 : 950);
  }

  function render(quick) {
    var f = FRAMEWORKS[fw];
    renderFws();
    S.$("covTitle").textContent = "Coverage · " + f.sub;
    S.$("ctrlTitle").textContent = f.key === "attack" ? "Techniques assessed" : f.key === "e8" ? "Mitigation strategies assessed" : "Controls assessed";
    var evid = f.controls.filter(function (c) { return c.status === "EVIDENCED"; }).length;
    var gaps = f.controls.filter(function (c) { return c.status === "CLEAR"; }).length;
    var stats = [f.stats[0], ["Evidenced", String(evid)], ["No evidence", String(gaps)]];
    S.replace(S.$("covStats"), stats.map(function (s) {
      return el("div", { style: "text-align:right;" }, el("div", { className: "mono", style: "font-size:18px;color:#fff;" }, s[1]),
        el("div", { style: "font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap;" }, s[0]));
    }));
    renderHeat(f); renderCtrls(f); renderDoc(f, quick);
    requestAnimationFrame(function () { document.querySelectorAll(".bar > i[data-w]").forEach(function (i) { i.style.width = i.getAttribute("data-w") + "%"; }); });
  }

  function onRange() {
    S.replace(S.$("rangeSel"), S.rangeSelector(S.currentRange()));
    buildFrameworks();
    render();
  }
  onRange();
  S.onRangeChange(onRange);
});
</script>
</body>
</html>
